<script>
// ===================== ENGINE: CSV parsing & column modeling =====================
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  const n = text.length;
  for (let i = 0; i < n; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  while (rows.length && rows[rows.length - 1].every(v => v === '')) rows.pop();
  return rows;
}

function looksLikeDate(s) { if (!s) return false; s = s.trim(); return /^\d{1,2}[./]\d{1,2}[./]\d{2,4}$/.test(s); }
function looksLikeTime(s) { if (!s) return false; s = s.trim(); return /^\d{1,2}:\d{1,2}:\d{1,2}(\.\d+)?$/.test(s); }

function parseDateTime(dateStr, timeStr) {
  dateStr = (dateStr || '').trim(); timeStr = (timeStr || '').trim();
  let d, mo, y;
  if (dateStr.includes('.')) { const p = dateStr.split('.').map(Number); d = p[0]; mo = p[1]; y = p[2]; }
  else if (dateStr.includes('/')) { const p = dateStr.split('/').map(Number); mo = p[0]; d = p[1]; y = p[2]; }
  else return null;
  if (y < 100) y += 2000;
  const tparts = timeStr.split(':');
  const hh = Number(tparts[0]) || 0;
  const mm = Number(tparts[1]) || 0;
  const ss = parseFloat(tparts[2]) || 0;
  const wholeSec = Math.floor(ss);
  const ms = Math.round((ss - wholeSec) * 1000);
  const dt = new Date(y, mo - 1, d, hh, mm, wholeSec, ms);
  return isNaN(dt.getTime()) ? null : dt;
}

const CATEGORY_RULES = [
  { cat: 'CPU', re: /\bcpu\b|\bcore \d|\bcore(s)? (clock|usage|utility|ratio|temperature|power|vid)|tctl|tdie|ccd|prochot|\bhtc\b|package power|core c[016] residency|infinity fabric|fclk|uclk/i },
  { cat: 'GPU', re: /\bgpu\b|dgpu|igpu|vram|nvvdd|vddcr_gfx|12vhpwr|framerate|frame time/i },
  { cat: 'Memory', re: /memory|dram|\bdimm\b|page file|virtual memory/i },
  { cat: 'Storage', re: /drive|smart|s\.m\.a\.r\.t|disk|read (rate|total|activity)|write (rate|total|activity)/i },
  { cat: 'Network', re: /network|ethernet|wi-?fi|\bwlan\b|download|upload| dl | up |kb\/s/i },
  { cat: 'Motherboard', re: /motherboard|chipset|vrm|vcore|vddio|vsb|vbat|vtt|vmisc|vhif|vin\d|\+5v|\+12v|3vcc|3vsb|1\.8v|pmic|spd hub|fan|pump|rpm/i },
  { cat: 'PCIe', re: /pcie|pci express|dllp|tlp|lcrc|\bnak\b|replay|recovery count|correctable|fatal error|unsupported request/i },
  { cat: 'System', re: /^date$|^time$|whea/i },
];
function classifyColumn(name, hwLabel) {
  if (hwLabel) {
    const h = hwLabel.toLowerCase();
    if (h.startsWith('cpu') || h.includes('ryzen') || h.includes('intel core')) return 'CPU';
    if (h.startsWith('dgpu') || h.startsWith('igpu') || h.includes('geforce') || h.includes('radeon')) return 'GPU';
    if (h.includes('dimm') || h.includes('memory')) return 'Memory';
    if (h.startsWith('drive') || h.startsWith('s.m.a.r.t')) return 'Storage';
    if (h.startsWith('network')) return 'Network';
    if (h.includes('whea')) return 'System';
    if (h.includes('presentmon')) return 'GPU';
    if (h.includes('asus') || h.includes('gigabyte') || h.includes('msi') || h.includes('asrock') || h.includes('nuvoton') || h.includes('ite') || h.includes('chipset')) return 'Motherboard';
  }
  for (const rule of CATEGORY_RULES) if (rule.re.test(name)) return rule.cat;
  return 'Other';
}

function extractUnit(name) { const m = name.match(/\[([^\]]*)\]\s*$/); return m ? m[1] : ''; }

function computeStats(nums) {
  if (!nums.length) return null;
  const sorted = nums.slice().sort((a, b) => a - b);
  const sum = sorted.reduce((a, b) => a + b, 0);
  const avg = sum / sorted.length;
  const pct = p => sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))];
  const variance = sorted.reduce((a, b) => a + (b - avg) * (b - avg), 0) / sorted.length;
  return {
    min: sorted[0], max: sorted[sorted.length - 1], avg,
    median: pct(0.5), p1: pct(0.01), p5: pct(0.05), p95: pct(0.95), p99: pct(0.99),
    stdev: Math.sqrt(variance), count: sorted.length, last: nums[nums.length - 1],
  };
}

function extractSystemInfo(hwRow) {
  const info = { motherboard: null, cpu: null, gpus: [], ram: [], drives: [], networks: [] };
  if (!hwRow) return info;
  const seen = new Set();
  for (const v of hwRow) {
    const s = (v || '').trim();
    if (!s || seen.has(s)) continue;
    seen.add(s);
    const low = s.toLowerCase();
    if (low.startsWith('cpu [') && !info.cpu) info.cpu = s.replace(/^cpu \[#\d+\]:\s*/i, '');
    else if ((low.startsWith('dgpu') || low.startsWith('igpu'))) {
      const clean = s.replace(/^(dgpu|igpu) \[#\d+\]:\s*/i, '');
      const base = clean.split(':')[0].trim();
      if (base && !info.gpus.includes(base)) info.gpus.push(base);
    }
    else if (low.includes('dimm')) {
      const m = s.match(/DDR\d?\s*DIMM.*?:\s*(.+?)\s*\(/i);
      const label = m ? m[1] : s;
      if (!info.ram.includes(label)) info.ram.push(label);
    }
    else if (low.startsWith('drive:')) {
      const clean = s.replace(/^drive:\s*/i, '');
      if (!info.drives.includes(clean)) info.drives.push(clean);
    }
    else if (low.startsWith('network:')) {
      const clean = s.replace(/^network:\s*/i, '').split(' - ')[0].trim();
      if (!info.networks.includes(clean)) info.networks.push(clean);
    }
    else if (/gaming|strix|aorus|tomahawk|prime|taichi|carbon|hero|extreme|apex|pro art|unify|ace\b/i.test(s) && !/dimm|drive|cpu|gpu/i.test(low)) {
      if (!info.motherboard) info.motherboard = s;
    }
  }
  return info;
}

function parseHWiNFOFile(fileName, text, meta) {
  const rows = parseCSV(text);
  if (!rows.length || rows.length < 2) throw new Error(`"${fileName}" does not look like an HWiNFO CSV log (no data rows found).`);

  const header0 = rows[0];
  if (!(/^date$/i.test(header0[0] || '') && /^time$/i.test(header0[1] || ''))) {
    throw new Error(`"${fileName}" does not look like an HWiNFO CSV log (expected "Date,Time,..." header).`);
  }

  let dataEnd = rows.length;
  for (let i = rows.length - 1; i >= 1; i--) {
    if (looksLikeDate(rows[i][0]) && looksLikeTime(rows[i][1])) { dataEnd = i + 1; break; }
  }
  const footerRows = rows.slice(dataEnd);
  const dataRows = rows.slice(1, dataEnd);
  if (!dataRows.length) throw new Error(`"${fileName}" has a header but no readable data rows.`);

  let canonHeader = header0;
  let hwRow = null;
  for (const fr of footerRows) {
    if (fr[0] === 'Date' && fr[1] === 'Time') { if (fr.length > canonHeader.length) canonHeader = fr; }
    else {
      const nonEmpty = fr.filter(v => v && v.trim()).length;
      if (nonEmpty > fr.length * 0.3) hwRow = fr;
    }
  }
  const numCols = canonHeader.length;
  const columns = canonHeader.map((name, i) => ({
    index: i, name: name || `Column ${i}`, unit: extractUnit(name || ''), hwLabel: hwRow ? (hwRow[i] || '') : '',
  }));
  columns.forEach(c => { c.category = classifyColumn(c.name, c.hwLabel); });

  const nRows = dataRows.length;
  const timestamps = new Array(nRows);
  const isNumericCol = new Array(numCols).fill(true);
  const isBooleanCol = new Array(numCols).fill(true);
  const raw = columns.map(() => new Array(nRows));

  for (let r = 0; r < nRows; r++) {
    const row = dataRows[r];
    timestamps[r] = parseDateTime(row[0], row[1]);
    for (let c = 0; c < numCols; c++) {
      const cell = c < row.length ? row[c] : '';
      const v = cell == null ? '' : cell.trim();
      raw[c][r] = v;
      if (v !== '' && v !== '-') {
        const low = v.toLowerCase();
        if (low !== 'yes' && low !== 'no' && isNaN(parseFloat(v))) isNumericCol[c] = false;
        if (low !== 'yes' && low !== 'no') isBooleanCol[c] = false;
      }
    }
  }
  isNumericCol[0] = false; isNumericCol[1] = false; isBooleanCol[0] = false; isBooleanCol[1] = false;

  columns.forEach((col, c) => {
    col.isNumeric = isNumericCol[c] && !isBooleanCol[c];
    col.isBoolean = isBooleanCol[c];
    if (col.isNumeric) {
      const nums = [];
      const series = new Array(nRows);
      for (let r = 0; r < nRows; r++) {
        const v = raw[c][r];
        if (v !== '' && v !== '-') { const f = parseFloat(v); if (!isNaN(f)) { nums.push(f); series[r] = f; } else series[r] = null; }
        else series[r] = null;
      }
      col.numData = nums;
      col.series = series; // aligned with file.timestamps, null = missing
      col.stats = computeStats(nums);
    } else if (col.isBoolean) {
      // boolSeries mirrors col.series (row-aligned, null = missing) so a trimmed
      // comparison window (see buildTrimmedFileView in app_compare.js) can recompute
      // throttle/warning-flag percentages for just that window instead of the whole file.
      let trueCount = 0, total = 0;
      const boolSeries = new Array(nRows);
      for (let r = 0; r < nRows; r++) {
        const v = raw[c][r];
        if (v === '') { boolSeries[r] = null; continue; }
        const isTrue = v.toLowerCase() === 'yes';
        boolSeries[r] = isTrue;
        total++; if (isTrue) trueCount++;
      }
      col.boolSeries = boolSeries;
      col.boolStats = { trueCount, total, trueFraction: total ? trueCount / total : 0 };
    }
  });

  let startTime = null, endTime = null;
  for (const t of timestamps) { if (t) { if (!startTime || t < startTime) startTime = t; if (!endTime || t > endTime) endTime = t; } }

  return {
    fileName, columns, timestamps, nRows,
    startTime, endTime, durationMs: (startTime && endTime) ? (endTime - startTime) : 0,
    systemInfo: extractSystemInfo(hwRow),
    lastModified: (meta && meta.lastModified) || null,
  };
}

// Build [{t,v}] points for a numeric column, skipping rows with no timestamp or no value.
function pointsFor(file, col) {
  if (!col || !col.series) return [];
  const pts = [];
  for (let r = 0; r < file.nRows; r++) {
    const t = file.timestamps[r];
    const v = col.series[r];
    if (t != null && v != null) pts.push({ t: t.getTime(), v });
  }
  return pts;
}


// ===================== HARDWARE SPECS: model-aware thresholds =====================
// Approximate stock/reference specs for common current desktop CPUs/GPUs. Used to swap
// generic one-size-fits-all thermal/power thresholds for model-aware ones when the model
// can be identified from the log's hardware descriptor row (e.g. a 95C Tjmax cap on most
// Ryzen desktop parts vs. 100C on Intel — judging both against the same number is wrong
// in both directions). These are typical *factory-default* figures — real systems vary by
// motherboard vendor (many boards raise CPU power limits above AMD/Intel's own stock spec
// by default) and by AIB card, so they're always presented in the UI as approximate context
// rather than a hard pass/fail line, and unmatched hardware falls back to the generic
// thresholds untouched.
const CPU_SPECS = [
  { match: /9950X3D/i, name: 'Ryzen 9 9950X3D', pptW: 230, tjMaxC: 95 },
  { match: /9900X3D/i, name: 'Ryzen 9 9900X3D', pptW: 162, tjMaxC: 95 },
  { match: /9800X3D/i, name: 'Ryzen 7 9800X3D', pptW: 162, tjMaxC: 95 },
  { match: /9950X(?!3D)/i, name: 'Ryzen 9 9950X', pptW: 230, tjMaxC: 95 },
  { match: /9700X/i, name: 'Ryzen 7 9700X', pptW: 142, tjMaxC: 95, note: 'AMD\'s own spec is a 65W/88W PPT part, but most motherboards default to a 105W "performance mode" (142W PPT) instead — so higher power draw here is usually the board, not a problem.' },
  { match: /7950X3D/i, name: 'Ryzen 9 7950X3D', pptW: 162, tjMaxC: 89 },
  { match: /7800X3D/i, name: 'Ryzen 7 7800X3D', pptW: 162, tjMaxC: 89 },
  { match: /7950X(?!3D)/i, name: 'Ryzen 9 7950X', pptW: 230, tjMaxC: 95 },
  { match: /7600X/i, name: 'Ryzen 5 7600X', pptW: 142, tjMaxC: 95 },
  { match: /14900K/i, name: 'Core i9-14900K', pptW: 253, tjMaxC: 100 },
  { match: /14700K/i, name: 'Core i7-14700K', pptW: 253, tjMaxC: 100 },
  { match: /14600K/i, name: 'Core i5-14600K', pptW: 181, tjMaxC: 100 },
  { match: /Ultra 9 285K/i, name: 'Core Ultra 9 285K', pptW: 250, tjMaxC: 100 },
  { match: /Ultra 7 265K/i, name: 'Core Ultra 7 265K', pptW: 250, tjMaxC: 100 },
];

const GPU_SPECS = [
  { match: /RTX 5090/i, name: 'GeForce RTX 5090', tbpW: 575, coreThrottleC: 90, note: 'Blackwell (RTX 50-series) hides its hot-spot sensor from monitoring tools like HWiNFO, so only core/edge temperature is visible here.' },
  { match: /RTX 5080/i, name: 'GeForce RTX 5080', tbpW: 360, coreThrottleC: 90, note: 'Blackwell (RTX 50-series) hides its hot-spot sensor from monitoring tools like HWiNFO, so only core/edge temperature is visible here.' },
  { match: /RTX 5070 Ti/i, name: 'GeForce RTX 5070 Ti', tbpW: 300, coreThrottleC: 90, note: 'Blackwell (RTX 50-series) hides its hot-spot sensor from monitoring tools like HWiNFO, so only core/edge temperature is visible here.' },
  { match: /RTX 5070(?! Ti)/i, name: 'GeForce RTX 5070', tbpW: 250, coreThrottleC: 90, note: 'Blackwell (RTX 50-series) hides its hot-spot sensor from monitoring tools like HWiNFO, so only core/edge temperature is visible here.' },
  { match: /RTX 4090/i, name: 'GeForce RTX 4090', tbpW: 450, coreThrottleC: 90, hotspotThrottleC: 105 },
  { match: /RTX 4080/i, name: 'GeForce RTX 4080', tbpW: 320, coreThrottleC: 90, hotspotThrottleC: 105 },
  { match: /RTX 4070 Ti/i, name: 'GeForce RTX 4070 Ti', tbpW: 285, coreThrottleC: 90, hotspotThrottleC: 105 },
  { match: /RTX 4070(?! Ti)/i, name: 'GeForce RTX 4070', tbpW: 220, coreThrottleC: 90, hotspotThrottleC: 105 },
  { match: /RX 9070 XT/i, name: 'Radeon RX 9070 XT', tbpW: 304, coreThrottleC: 110, note: 'AMD documents junction/hot-spot temperatures up to ~110°C as normal for this card — noticeably higher than Nvidia\'s norms, so it shouldn\'t be judged by Nvidia-style thresholds.' },
  { match: /RX 9070(?! XT)/i, name: 'Radeon RX 9070', tbpW: 220, coreThrottleC: 110, note: 'AMD documents junction/hot-spot temperatures up to ~110°C as normal for this card — noticeably higher than Nvidia\'s norms, so it shouldn\'t be judged by Nvidia-style thresholds.' },
  { match: /RX 7900 XTX/i, name: 'Radeon RX 7900 XTX', tbpW: 355, coreThrottleC: 110, note: 'AMD documents junction/hot-spot temperatures up to ~110°C as normal for this card — noticeably higher than Nvidia\'s norms, so it shouldn\'t be judged by Nvidia-style thresholds.' },
  { match: /RX 7900 XT(?!X)/i, name: 'Radeon RX 7900 XT', tbpW: 315, coreThrottleC: 110, note: 'AMD documents junction/hot-spot temperatures up to ~110°C as normal for this card — noticeably higher than Nvidia\'s norms, so it shouldn\'t be judged by Nvidia-style thresholds.' },
  { match: /RX 7800 XT/i, name: 'Radeon RX 7800 XT', tbpW: 263, coreThrottleC: 110, note: 'AMD documents junction/hot-spot temperatures up to ~110°C as normal for this card — noticeably higher than Nvidia\'s norms, so it shouldn\'t be judged by Nvidia-style thresholds.' },
];

function matchCpuSpec(cpuLabel) {
  if (!cpuLabel) return null;
  for (const spec of CPU_SPECS) if (spec.match.test(cpuLabel)) return spec;
  return null;
}
function matchGpuSpec(gpuLabels) {
  if (!gpuLabels || !gpuLabels.length) return null;
  for (const label of gpuLabels) for (const spec of GPU_SPECS) if (spec.match.test(label)) return spec;
  return null;
}

// Convenience bundle used by both the rule engine and the UI so the two never disagree
// about which spec matched a given file.
function getHardwareSpecs(file) {
  const sys = file.systemInfo || {};
  return { cpuSpec: matchCpuSpec(sys.cpu), gpuSpec: matchGpuSpec(sys.gpus) };
}


// ===================== RULES: key metrics + issue detection =====================
const KEY_METRICS = [
  { id: 'cpu_temp', label: 'CPU Temperature', group: 'thermals', unit: '°C', patterns: [/^CPU \(Tctl\/Tdie\)/i, /^CPU Package \[/i, /^Core Max\(Tj\)/i, /^CPU Die \(average\)/i, /^CPU \[.?C\]$/i] },
  { id: 'vrm_temp', label: 'CPU VRM Temperature', group: 'thermals', unit: '°C', patterns: [/^CPU VDDCR_VDD VRM/i] },
  { id: 'gpu_vrm_temp', label: 'GPU VRM Temperature', group: 'thermals', unit: '°C', patterns: [/^GPU VRM1 Temperature/i, /^GPU VRM Temperature/i] },
  { id: 'gpu_temp', label: 'GPU Temperature', group: 'thermals', unit: '°C', patterns: [/^GPU Temperature \[/i] },
  { id: 'gpu_hotspot', label: 'GPU Hot Spot', group: 'thermals', unit: '°C', patterns: [/^GPU Hot Spot Temperature/i, /^GPU Hotspot/i] },
  { id: 'gpu_mem_temp', label: 'GPU Memory Junction Temp', group: 'thermals', unit: '°C', patterns: [/^GPU Memory Junction Temperature/i] },
  { id: 'motherboard_temp', label: 'Motherboard Temperature', group: 'thermals', unit: '°C', patterns: [/^Motherboard \[/i] },

  { id: 'cpu_power', label: 'CPU Package Power', group: 'power', unit: 'W', patterns: [/^CPU Package Power/i, /^CPU PPT \[/i] },
  { id: 'gpu_power', label: 'GPU Power', group: 'power', unit: 'W', patterns: [/^GPU Power \[/i] },
  { id: 'vcore', label: 'Vcore', group: 'power', unit: 'V', patterns: [/^Vcore \[/i, /^CPU VDDCR_VDD Voltage/i, /^CPU Core Voltage/i] },

  { id: 'cpu_usage', label: 'Total CPU Usage', group: 'perf', unit: '%', patterns: [/^Total CPU Usage/i] },
  { id: 'cpu_clock', label: 'Core Clocks (avg)', group: 'perf', unit: 'MHz', patterns: [/^Core Clocks \(avg\)/i, /^Core Average Clock/i] },
  { id: 'gpu_util', label: 'GPU Utilization', group: 'perf', unit: '%', patterns: [/^GPU Utilization/i, /^GPU Core Load/i] },
  { id: 'gpu_clock', label: 'GPU Clock', group: 'perf', unit: 'MHz', patterns: [/^GPU Clock \[/i] },
  { id: 'fps_avg', label: 'Framerate (avg)', group: 'perf', unit: 'FPS', patterns: [/^Framerate Presented \(avg\)/i] },
  { id: 'fps_1low', label: 'Framerate (1% low)', group: 'perf', unit: 'FPS', patterns: [/^Framerate Presented \(1%\)/i] },
  { id: 'fps_displayed_avg', label: 'Framerate Displayed (avg)', group: 'gaming', unit: 'FPS', patterns: [/^Framerate Displayed \(avg\)/i] },
  { id: 'fps_displayed_1low', label: 'Framerate Displayed (1% low)', group: 'gaming', unit: 'FPS', patterns: [/^Framerate Displayed \(1%\)/i] },
  { id: 'frame_time_avg', label: 'Frame Time (avg)', group: 'gaming', unit: 'ms', patterns: [/^Frame Time Presented \(avg\)/i] },
  { id: 'gpu_busy', label: 'GPU Busy', group: 'gaming', unit: 'ms', patterns: [/^GPU Busy \(avg\)/i] },
  { id: 'gpu_wait', label: 'GPU Wait', group: 'gaming', unit: 'ms', patterns: [/^GPU Wait \(avg\)/i] },
  { id: 'cpu_busy', label: 'CPU Busy', group: 'gaming', unit: 'ms', patterns: [/^CPU Busy \(avg\)/i] },
  { id: 'cpu_wait', label: 'CPU Wait', group: 'gaming', unit: 'ms', patterns: [/^CPU Wait \(avg\)/i] },

  { id: 'ram_load', label: 'Physical Memory Load', group: 'memory', unit: '%', patterns: [/^Physical Memory Load/i] },
  { id: 'pagefile_use', label: 'Page File Usage', group: 'memory', unit: '%', patterns: [/^Page File Usage/i] },
  { id: 'dram_read_bw', label: 'DRAM Read Bandwidth', group: 'memory', unit: 'GB/s', patterns: [/^DRAM Read Bandwidth/i] },
  { id: 'dram_write_bw', label: 'DRAM Write Bandwidth', group: 'memory', unit: 'GB/s', patterns: [/^DRAM Write Bandwidth/i] },
];

const BOOL_METRICS = [
  { id: 'cpu_htc', label: 'CPU Thermal Throttling (HTC)', patterns: [/^Thermal Throttling \(HTC\)/i] },
  { id: 'cpu_prochot', label: 'CPU PROCHOT Throttling', patterns: [/^Thermal Throttling \(PROCHOT CPU\)/i, /^Thermal Throttling \(PROCHOT EXT\)/i] },
  { id: 'gpu_thermal_throttle', label: 'GPU Thermal Throttling', patterns: [/^Throttle Reason - Thermal/i, /^Performance Limit - Thermal/i] },
  { id: 'gpu_power_throttle', label: 'GPU Power-Limit Throttling', patterns: [/^Throttle Reason - Power/i, /^Performance Limit - Power/i] },
  { id: 'gpu_voltage_limit', label: 'GPU Reliability-Voltage Limit', patterns: [/^Performance Limit - Reliability Voltage/i] },
  { id: 'drive_warning', label: 'Drive Warning', patterns: [/^Drive Warning/i] },
  { id: 'drive_failure', label: 'Drive Failure (SMART)', patterns: [/^Drive Failure/i] },
  { id: 'pmic_high_temp', label: 'RAM PMIC High Temperature', patterns: [/^PMIC High Temperature/i] },
];

function findColumnsByPattern(file, patterns) {
  const out = [];
  for (const re of patterns) for (const col of file.columns) if (re.test(col.name)) out.push(col);
  return out;
}
function firstMatch(file, patterns, filter) {
  // Try every pattern in priority order. Several columns can share the same
  // display name (e.g. two unrelated "GPU Clock [MHz]" sensors), and a name
  // match can also turn out to be an unpopulated legacy sensor stuck at a
  // constant value — so within and across patterns, prefer the first column
  // that actually varies, and only fall back to a flat one if nothing varies.
  let fallback = null;
  for (const re of patterns) {
    const hits = file.columns.filter(c => re.test(c.name) && (!filter || filter(c)));
    if (!hits.length) continue;
    if (!fallback) fallback = hits[0];
    const varying = hits.find(c => !(c.stats && c.stats.max === c.stats.min));
    if (varying) return varying;
  }
  return fallback;
}
function resolveKeyMetrics(file) {
  const resolved = {};
  for (const m of KEY_METRICS) resolved[m.id] = firstMatch(file, m.patterns, c => c.isNumeric && c.stats);
  return resolved;
}
function resolveBoolMetrics(file) {
  const resolved = {};
  for (const m of BOOL_METRICS) resolved[m.id] = findColumnsByPattern(file, m.patterns).filter(c => c.isBoolean && c.boolStats && c.boolStats.total > 0);
  return resolved;
}
function findAllNumeric(file, re) { return file.columns.filter(c => re.test(c.name) && c.isNumeric && c.stats && c.stats.count > 0); }

const SEVERITY_RANK = { critical: 4, serious: 3, warning: 2, info: 1 };
function pctTrue(cols) { let t = 0, tot = 0; for (const c of cols) { t += c.boolStats.trueCount; tot += c.boolStats.total; } return tot ? t / tot : 0; }
function fmtPct(x) { return `${Math.round(x * 100)}%`; }
function fmtDur(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), rs = s % 60;
  if (m < 60) return `${m}m ${rs}s`;
  const h = Math.floor(m / 60), rm = m % 60;
  return `${h}h ${rm}m`;
}
function stripUnit(name) { return name.replace(/\s*\[.*\]$/, ''); }

function detectIssues(file) {
  const km = resolveKeyMetrics(file);
  const bm = resolveBoolMetrics(file);
  const { cpuSpec, gpuSpec } = (typeof getHardwareSpecs === 'function') ? getHardwareSpecs(file) : { cpuSpec: null, gpuSpec: null };
  const issues = [];
  const add = (id, severity, title, detail, suggestion, evidenceCol, category) => {
    issues.push({ id, severity, title, detail, suggestion, category, evidenceCol: evidenceCol || null, file: file.fileName });
  };

  if (km.cpu_temp) {
    const s = km.cpu_temp.stats;
    // When the CPU model is recognized, judge it against that model's own documented
    // Tjmax/throttle point instead of a generic desktop-CPU number — Ryzen X3D parts
    // throttle several degrees below plain Ryzen/Intel parts, for example.
    const tj = cpuSpec ? cpuSpec.tjMaxC : 100;
    const critT = tj - 3, seriousT = tj - 10, warningT = tj - 15;
    const specNote = cpuSpec ? ` (identified as a ${cpuSpec.name}, which throttles around ${tj}°C)` : '';
    if (s.max >= critT) add('cpu_temp', 'critical', 'CPU running critically hot', `Peaked at ${s.max.toFixed(1)}°C (avg ${s.avg.toFixed(1)}°C)${specNote}. This is at or above the typical throttle point for ${cpuSpec ? 'this CPU' : 'modern desktop CPUs'}.`,
      'Reseat the cooler and repaste with fresh thermal compound, verify mounting pressure/backplate screws are even, confirm cooler and case fans are actually spinning at expected RPM, and check case airflow (intake/exhaust balance, dust filters). If this is a new build, some coolers ship with a protective film left on the coldplate — remove it. Also confirm the BIOS is not running an aggressive "performance" power preset beyond the CPU\'s rated limits.', km.cpu_temp, 'CPU');
    else if (s.max >= seriousT) add('cpu_temp', 'serious', 'CPU temperature is high under load', `Peaked at ${s.max.toFixed(1)}°C (avg ${s.avg.toFixed(1)}°C, 95th percentile ${s.p95.toFixed(1)}°C)${specNote}.`,
      'This can be within spec for high-core-count CPUs under sustained heavy load — some parts are designed to run near their limit and throttle gracefully. Still worth confirming cooler contact/mounting and case airflow, and checking whether a motherboard performance/PBO preset is pushing power beyond stock.', km.cpu_temp, 'CPU');
    else if (s.p95 >= warningT) add('cpu_temp', 'warning', 'CPU runs warm for extended periods', `95th-percentile temperature is ${s.p95.toFixed(1)}°C (max ${s.max.toFixed(1)}°C)${specNote}.`,
      'Worth keeping an eye on. Check dust buildup in the cooler fins/radiator, fan curve aggressiveness in BIOS, and ambient case temperature.', km.cpu_temp, 'CPU');
  }
  if (km.cpu_power && cpuSpec) {
    const s = km.cpu_power.stats;
    if (s.max >= cpuSpec.pptW * 1.15) add('cpu_power_over_spec', 'info', 'CPU power draw exceeds its stock power limit', `Peaked at ${s.max.toFixed(0)}W, above the ${cpuSpec.name}'s stock PPT/power limit of ${cpuSpec.pptW}W.`,
      `${cpuSpec.note ? cpuSpec.note + ' ' : ''}This usually means a motherboard "performance"/PBO preset or a manually raised power limit is active, not a fault. It's not inherently a problem, but it does mean the CPU is running outside AMD/Intel's own stock envelope, which affects how much of the thermal headroom above is really "spare."`, km.cpu_power, 'CPU');
  }
  const cpuThrottleCols = [...(bm.cpu_htc || []), ...(bm.cpu_prochot || [])];
  if (cpuThrottleCols.length) {
    const frac = pctTrue(cpuThrottleCols);
    if (frac > 0.01) add('cpu_throttle', frac > 0.15 ? 'critical' : (frac > 0.03 ? 'serious' : 'warning'), 'CPU hardware thermal throttling engaged',
      `The CPU's own thermal protection (HTC/PROCHOT) was active for ${fmtPct(frac)} of this session.`,
      'This is the CPU actively cutting clocks to protect itself — treat it as a cooling problem, not a tuning problem. Improve cooling (repaste, better airflow, a larger cooler) before changing any power or voltage settings.', null, 'CPU');
  }
  if (km.vcore) {
    const s = km.vcore.stats;
    if (s.max >= 1.55) add('vcore_high', 'serious', 'CPU voltage spikes are high', `Peak Vcore reached ${s.max.toFixed(3)}V (avg ${s.avg.toFixed(3)}V).`,
      "Brief transient spikes are normal on modern boards with fast voltage telemetry, but sustained voltage above roughly 1.4-1.45V raises long-term degradation risk. If a motherboard auto-overclock or performance profile is enabled, consider a more conservative preset or a manual voltage/curve-optimizer offset.", km.vcore, 'CPU');
  }
  const vrmCols = findAllNumeric(file, /VRM.*Temperature|VDDCR_VDD VRM|VDDCR_SOC VRM/i);
  for (const col of vrmCols) {
    const s = col.stats;
    if (s.max >= 100) add('vrm_temp_' + col.index, 'critical', `${stripUnit(col.name)} is very hot`, `Peaked at ${s.max.toFixed(1)}°C.`,
      'Sustained high VRM temperatures shorten regulator lifespan and can trigger unexpected shutdowns. Improve airflow directly over the VRM heatsink (a case fan or an AIO pump-mounted fan aimed at the socket area helps a lot on compact boards), and confirm the VRM heatsink is properly seated with intact thermal pads.', col, 'Motherboard');
    else if (s.max >= 90) add('vrm_temp_' + col.index, 'warning', `${stripUnit(col.name)} runs hot`, `Peaked at ${s.max.toFixed(1)}°C.`,
      'Keep an eye on this, especially in a compact case. A small fan directed at the VRM heatsink area is a cheap fix.', col, 'Motherboard');
  }
  if (km.gpu_temp) {
    const s = km.gpu_temp.stats;
    // AMD's RDNA cards are documented to run their core/junction sensor meaningfully
    // hotter than Nvidia parts as a matter of design — a flat 88C/80C bar flags healthy
    // Radeon cards as a problem and under-reacts on a genuinely hot Nvidia card.
    const throttleT = gpuSpec ? gpuSpec.coreThrottleC : 90;
    const seriousT = throttleT - 2, warningT = throttleT - 10;
    const specNote = gpuSpec ? ` (identified as a ${gpuSpec.name})` : '';
    if (s.max >= seriousT) add('gpu_temp', 'serious', 'GPU core temperature is high', `Peaked at ${s.max.toFixed(1)}°C${specNote}.${gpuSpec && gpuSpec.note ? ' ' + gpuSpec.note : ''}`,
      "Check that the case has adequate intake for the card's fans, that the fan curve isn't too passive at high load, and that the card is seated flat. Consider a more aggressive fan curve or improved case airflow.", km.gpu_temp, 'GPU');
    else if (s.max >= warningT) add('gpu_temp', 'warning', 'GPU runs warm under load', `Peaked at ${s.max.toFixed(1)}°C${specNote}.`,
      'Likely fine for most cards, but check case airflow and fan curve if you want more headroom.', km.gpu_temp, 'GPU');
  }
  if (km.gpu_power && gpuSpec) {
    const s = km.gpu_power.stats;
    if (s.max >= gpuSpec.tbpW * 1.1) add('gpu_power_over_spec', 'info', 'GPU power draw exceeds reference stock', `Peaked at ${s.max.toFixed(0)}W, above the ${gpuSpec.name}'s reference total board power of ${gpuSpec.tbpW}W.`,
      "This is typical of factory-overclocked/AIB cards with a raised power limit, or a manually raised power slider in the vendor's tuning software — not inherently a problem, just worth knowing when judging temperature headroom above.", km.gpu_power, 'GPU');
  }
  if (km.gpu_hotspot) {
    const s = km.gpu_hotspot.stats;
    const hsThrottle = (gpuSpec && gpuSpec.hotspotThrottleC) ? gpuSpec.hotspotThrottleC : 100;
    if (s.max >= hsThrottle) add('gpu_hotspot', 'critical', 'GPU hot-spot temperature is very high', `Peaked at ${s.max.toFixed(1)}°C${gpuSpec ? ` (reference throttle point for a ${gpuSpec.name} is around ${hsThrottle}°C)` : ''}.`,
      'A hot spot this high, especially alongside a much cooler core/edge reading, often points to thermal paste or pad degradation rather than a genuinely underpowered cooler. Consider a repaste/repad, and if this is a recent purchase, it may be worth raising with the vendor.', km.gpu_hotspot, 'GPU');
    else if (s.max >= 90) add('gpu_hotspot', 'warning', 'GPU hot-spot temperature runs high', `Peaked at ${s.max.toFixed(1)}°C${km.gpu_temp ? ` vs. ${km.gpu_temp.stats.max.toFixed(1)}°C core edge` : ''}.`,
      'A large gap between hot-spot and core/edge temperature is a common early sign of thermal paste wearing out. Worth monitoring over time.', km.gpu_hotspot, 'GPU');
  }
  if (bm.gpu_thermal_throttle && bm.gpu_thermal_throttle.length) {
    const frac = pctTrue(bm.gpu_thermal_throttle);
    if (frac > 0.02) add('gpu_thermal_throttle', frac > 0.2 ? 'serious' : 'warning', 'GPU thermally throttling', `Thermal throttle/limit flags were active for ${fmtPct(frac)} of the session.`,
      'The GPU is capping its own clocks to stay within temperature limits. Improve case/GPU cooling for more sustained performance.', null, 'GPU');
  }
  if (bm.gpu_power_throttle && bm.gpu_power_throttle.length) {
    const frac = pctTrue(bm.gpu_power_throttle);
    if (frac > 0.4) add('gpu_power_throttle', 'info', 'GPU frequently power-limited', `Power-limit throttling was active for ${fmtPct(frac)} of the session — expected under sustained full load.`,
      'This usually just means the GPU is using all the power headroom it is allowed. For more performance, raise the power limit in the vendor overclocking tool (if the card and PSU support it) or improve cooling so clocks can hold higher boost states for longer.', null, 'GPU');
  }
  const pinCurrentCols = findAllNumeric(file, /12VHPWR Pin\d Current/i);
  if (pinCurrentCols.length >= 2) {
    const maxes = pinCurrentCols.map(c => c.stats.max);
    const peakPin = Math.max(...maxes), minPeak = Math.min(...maxes), spread = peakPin - minPeak;
    if (peakPin >= 9.5) add('pin_current', 'critical', '12VHPWR connector pin current at unsafe level', `One or more pins peaked at ${peakPin.toFixed(2)}A, at or above the ~9.5A per-pin level associated with connector overheating risk on high-power GPUs.`,
      'Power down and physically inspect the 12VHPWR/12V-2x6 connector and cable for discoloration or deformation before continuing to use the system. Reseat the connector fully on both the PSU and GPU ends, try a different cable (a native PSU cable rather than an adapter, where possible), and avoid tight bends near the connector.', null, 'GPU');
    else if (spread >= 3) add('pin_imbalance', 'serious', '12VHPWR current is unevenly distributed across pins', `Peak per-pin current ranges from ${minPeak.toFixed(2)}A to ${peakPin.toFixed(2)}A across the connector's pins.`,
      'Uneven current sharing across the 12VHPWR/12V-2x6 pins is one of the early warning signs reported in connector-overheating cases on high-wattage cards. Make sure the connector is fully seated and not at an angle, and check it periodically for heat discoloration.', null, 'GPU');
  }
  const remainingLifeCols = findAllNumeric(file, /Drive Remaining Life/i);
  for (const col of remainingLifeCols) {
    const s = col.stats;
    if (s.min <= 70) add('drive_life_' + col.index, 'critical', 'Drive SMART health critically low', `Remaining life reported as low as ${s.min.toFixed(0)}%.`,
      "Back up this drive's data now and plan to replace it — SMART-reported remaining life this low means the drive's estimated endurance is largely used up.", col, 'Storage');
    else if (s.min <= 90) add('drive_life_' + col.index, 'warning', 'Drive SMART health degrading', `Remaining life reported as low as ${s.min.toFixed(0)}%.`,
      'Not urgent, but worth including this drive in your backup rotation and watching the trend over time.', col, 'Storage');
  }
  if (bm.drive_warning && pctTrue(bm.drive_warning) > 0) add('drive_warning', 'critical', 'Drive reported a SMART warning', 'One or more drives flagged a SMART warning condition during this session.',
    "Back up important data immediately and run the manufacturer's diagnostic tool (e.g. Samsung Magician, WD Dashboard, CrystalDiskInfo) for a full health report.", null, 'Storage');
  if (bm.drive_failure && pctTrue(bm.drive_failure) > 0) add('drive_failure', 'critical', 'Drive reported an imminent failure warning', 'A drive flagged an imminent-failure SMART condition.',
    "Back up this drive immediately and replace it — this flag specifically indicates the manufacturer's own firmware expects failure soon.", null, 'Storage');
  const driveTempCols = findAllNumeric(file, /^Drive Temperature\s*\d*\s*\[/i);
  const tempByDrive = new Map();
  for (const col of driveTempCols) {
    if (!col.hwLabel) continue;
    const cur = tempByDrive.get(col.hwLabel);
    if (!cur || col.stats.max > cur.stats.max) tempByDrive.set(col.hwLabel, col);
  }
  let driveIdx = 0;
  for (const [hwLabel, col] of tempByDrive.entries()) {
    driveIdx++;
    const label = hwLabel.replace(/^drive:\s*/i, '').replace(/^s\.m\.a\.r\.t\.?:\s*/i, '');
    if (col.stats.max >= 75) add('drive_temp_' + driveIdx, 'serious', `${label} is running very hot`, `Peaked at ${col.stats.max.toFixed(0)}°C.`,
      'NVMe SSDs throttle (and can wear out faster) when consistently this hot. Add a heatsink or improve airflow across the M.2 slot.', col, 'Storage');
    else if (col.stats.max >= 65) add('drive_temp_' + driveIdx, 'warning', `${label} runs hot under load`, `Peaked at ${col.stats.max.toFixed(0)}°C.`,
      "Consider checking or adding an M.2 heatsink, especially for sustained large file transfers.", col, 'Storage');
  }
  // Only counters that genuinely indicate a PCIe fault trigger the Warning/Serious
  // issue below. "Recovery Count" is deliberately excluded — per HWiNFO's own
  // developer, it tracks L0<->Recovery link-state transitions, which commonly fire
  // from an ordinary speed/width change (e.g. ASPM power-saving dropping the link to
  // a lower state when idle) rather than an actual error, so a nonzero, steady count
  // there is normal and not by itself a sign of a problem. It's surfaced separately
  // below at Info level instead of being lumped in with real fault counters.
  const pcieFaultPatterns = [/^Correctable Error Count/i, /^Non-Fatal Error Count/i, /^Fatal Error Count/i, /^Bad DLLP Count/i, /^Bad TLP Count/i, /^LCRC Error Count/i, /^Replay Count/i];
  let pcieTotal = 0; const pcieDetail = [];
  for (const re of pcieFaultPatterns) for (const col of findAllNumeric(file, re)) if (col.stats.max > 0) { pcieTotal += col.stats.max; pcieDetail.push(`${stripUnit(col.name)}: ${col.stats.max}`); }
  if (pcieTotal > 0) add('pcie_errors', pcieTotal > 50 ? 'serious' : 'warning', 'PCI Express link errors detected', `Non-zero PCIe error counters: ${pcieDetail.join(', ')}.`,
    'A small number of correctable errors can happen occasionally, but a growing count usually points to a seating or signal-integrity issue: reseat the GPU (and any PCIe riser cable) firmly, try a different PCIe slot or riser cable, update chipset and GPU drivers, and confirm PCIe power connectors are fully seated. If errors keep climbing, they can eventually cause driver crashes or a reduced link speed.', null, 'PCIe');
  for (const col of findAllNumeric(file, /^Recovery Count/i)) {
    if (col.stats.max > 0) add('pcie_recovery', 'info', 'PCIe link recovery events observed', `Recovery Count: ${col.stats.max}.`,
      "This usually just reflects the link changing speed or width — commonly triggered by ASPM (PCIe power management) dropping the link to a lower state when idle — rather than an actual error, so a steady nonzero count here is normal on most systems. If you want to rule ASPM out, you can disable it in BIOS or set your GPU's Windows power management mode to \"Prefer maximum performance.\" This is separate from PCI Express link errors above, which are the counters that actually indicate a fault.", col, 'PCIe');
  }
  for (const col of findAllNumeric(file, /whea/i)) {
    if (col.stats.max > 0) add('whea', 'critical', 'Windows Hardware Error (WHEA) events logged', `${col.name} reached ${col.stats.max}.`,
      "WHEA events are logged by Windows when hardware reports a correctable or uncorrectable error. The most common cause is an unstable memory overclock — try resetting EXPO/XMP to a lower rated speed (or disabling it) and re-testing with MemTest86 or Karhu RAM Test. If it persists at JEDEC/stock memory speed, suspect the CPU's SoC/VDDIO voltages, the PCIe/GPU link, or a pending BIOS update.", col, 'System');
  }
  const memCfg = (typeof checkMemoryConfig === 'function') ? checkMemoryConfig(file) : null;
  if (memCfg && memCfg.mismatch) {
    const r = memCfg.rated;
    add('memory_expo', memCfg.gapPct > 0.25 ? 'serious' : 'warning', 'Memory may be running below its rated speed',
      `The module label suggests DDR-${r.ratedSpeed}${r.ratedCAS ? ` CL${r.ratedCAS}` : ''}, but this log shows it running at roughly DDR-${memCfg.observedSpeed}${memCfg.observedCAS ? ` CL${memCfg.observedCAS}` : ''} — about ${fmtPct(memCfg.gapPct)} slower than rated.`,
      `This usually means EXPO (AMD) or XMP (Intel) isn't enabled in BIOS, so the memory is running near JEDEC default timings instead of its rated profile. Enabling EXPO/XMP (or setting the profile manually) is one of the highest-value free performance changes available, especially for gaming and especially on Ryzen X3D chips, which are sensitive to memory/Infinity Fabric speed. After enabling it, run a stability test (e.g. Karhu RAM Test or a few hours of TM5) since higher-speed profiles occasionally need a small SoC/VDDIO voltage nudge to be fully stable.`,
      null, 'Memory');
  }
  if (km.ram_load) {
    const s = km.ram_load.stats;
    if (s.p95 >= 92) add('ram_pressure', 'warning', 'Physical memory usage runs very high', `95th-percentile memory load was ${s.p95.toFixed(0)}% (peak ${s.max.toFixed(0)}%).`,
      'Sustained high memory pressure can cause stutter and heavy page-file paging. Consider closing background apps/browser tabs during demanding sessions, or adding more RAM if this is a regular pattern.', km.ram_load, 'Memory');
  }
  const rpmCols = file.columns.filter(c => /\[RPM\]$/i.test(c.name) && c.isNumeric && c.stats && c.stats.max > 200);
  for (const col of rpmCols) {
    if (col.stats.min === 0) add('fan_stall_' + col.index, 'warning', `${stripUnit(col.name)} reported 0 RPM at times`, `Ranged from 0 to ${col.stats.max.toFixed(0)} RPM.`,
      'This can be normal for a fan using a 0-RPM "silent" mode at low load, or it can indicate an intermittent connection or a failing fan. If this fan cools something that also ran hot in this log, check the cable seating and the fan curve in BIOS.', col, 'Motherboard');
  }
  // Gaming: capture-target sanity, stutter, and render-to-display pacing.
  const gaming = (typeof gamingSummary === 'function') ? gamingSummary(file) : null;
  if (gaming && gaming.process) {
    if (!gaming.isGame) {
      add('capture_not_game', 'info', `Frame data captured from "${gaming.process}", not a game`, `The framerate/frame-time readings in this log reflect ${gaming.process} (a system process), not gameplay.`,
        `These numbers aren't representative of in-game performance — HWiNFO wasn't attached to a foreground game during this capture. To measure real game performance, start the HWiNFO log (or leave it running) while the game is in focus and being played.`, null, 'GPU');
    } else if (gaming.stutter && gaming.stutter.activeCount >= 60) {
      const frac = gaming.stutter.count / gaming.stutter.activeCount;
      if (frac > 0.08 || gaming.stutter.worstMs > 50) {
        add('frame_stutter', frac > 0.2 || gaming.stutter.worstMs > 100 ? 'serious' : 'warning', 'Frequent frame time spikes (stutter)',
          `${gaming.stutter.count} of ${gaming.stutter.activeCount} active frames (${fmtPct(frac)}) ran past ${gaming.stutter.thresholdMs.toFixed(0)}ms — well above the session's typical ${gaming.stutter.medianMs.toFixed(1)}ms frame time. Worst frame: ${gaming.stutter.worstMs.toFixed(0)}ms.`,
          'Frame-time spikes like this are usually invisible in an average FPS number but very visible to a player. Common causes: background apps or overlays (Discord, browser, RGB software), an unstable memory overclock, CPU or GPU thermal throttling (check the Thermals tab for the same time window), an outdated GPU driver, or shader-compilation stutter in that specific game.', km.frame_time_avg, 'GPU');
      }
    }
    if (gaming.isGame && gaming.pacing && gaming.pacing.gapPct > 0.15) {
      add('frame_pacing_drop', 'warning', 'Frames dropped between render and display', `Displayed framerate (${gaming.pacing.displayedAvg.toFixed(0)} FPS) is ${fmtPct(gaming.pacing.gapPct)} lower than what was rendered (${gaming.pacing.presentedAvg.toFixed(0)} FPS).`,
        'A gap this size between "presented" and "displayed" frames usually means frames are being dropped or repeated by the display pipeline rather than a raw rendering shortfall. Check that V-Sync/G-Sync/FreeSync settings match between the game, driver, and monitor, close capture/overlay software, and make sure the game is running at (or below) your monitor\'s refresh rate.', null, 'GPU');
    }
  }

  issues.sort((a, b) => SEVERITY_RANK[b.severity] - SEVERITY_RANK[a.severity]);
  return issues;
}


// ===================== GAMING: bottleneck, stutter, frame pacing, capture-target detection =====================
// System/shell processes HWiNFO's PresentMon commonly attaches to when no game is in
// the foreground — seeing one of these means the frame data below is desktop
// compositor activity, not gameplay.
const NON_GAME_PROCESSES = new Set([
  'dwm.exe', 'explorer.exe', 'shellexperiencehost.exe', 'searchhost.exe', 'searchapp.exe',
  'applicationframehost.exe', 'lockapp.exe', 'startmenuexperiencehost.exe', 'textinputhost.exe',
  'systemsettings.exe', 'widgets.exe', 'gamebar.exe', 'gamebarftserver.exe',
]);

function getPresentMonProcess(file) {
  for (const col of file.columns) {
    const m = /^PresentMon \[(.+?)\]$/i.exec(col.hwLabel || '');
    if (m) return m[1];
  }
  return null;
}
function isNonGameProcess(procName) { return !!procName && NON_GAME_PROCESSES.has(procName.toLowerCase()); }

// Only frames faster than this (i.e. shorter frame time) count as "active" gameplay —
// excludes idle desktop stalls where HWiNFO still logs a (huge) "frame" while nothing
// is being rendered.
const ACTIVE_FRAME_TIME_CAP_MS = 100; // ~10 FPS floor

function activeFrameIndices(file) {
  const km = resolveKeyMetrics(file);
  const ft = km.frame_time_avg;
  if (!ft || !ft.series) return null;
  const idx = [];
  for (let r = 0; r < file.nRows; r++) { const v = ft.series[r]; if (v != null && v > 0 && v < ACTIVE_FRAME_TIME_CAP_MS) idx.push(r); }
  return { ft, idx };
}

// Compares per-frame GPU Busy vs CPU Busy time (both derived from the same PresentMon
// capture) across active frames: whichever is closer to the full frame time is treated
// as that frame's bottleneck. This is a simplified heuristic, not a cycle-accurate
// profiler result, and is presented as such in the UI.
function computeBottleneck(file) {
  const active = activeFrameIndices(file);
  if (!active) return null;
  const km = resolveKeyMetrics(file);
  const gpuBusy = km.gpu_busy, cpuBusy = km.cpu_busy;
  if (!gpuBusy || !cpuBusy || !gpuBusy.series || !cpuBusy.series) return null;
  let gpuBound = 0, cpuBound = 0, counted = 0;
  for (const r of active.idx) {
    const g = gpuBusy.series[r], c = cpuBusy.series[r];
    if (g == null || c == null) continue;
    counted++;
    if (g >= c) gpuBound++; else cpuBound++;
  }
  if (counted < 20) return null; // not enough active-frame data to say anything meaningful
  return { gpuBoundPct: gpuBound / counted, cpuBoundPct: cpuBound / counted, sampleCount: counted };
}

// Flags frames far slower than the session's own typical (active) frame time.
function detectStutters(file) {
  const active = activeFrameIndices(file);
  if (!active || active.idx.length < 20) return null;
  const vals = active.idx.map(r => active.ft.series[r]).sort((a, b) => a - b);
  const median = vals[Math.floor(vals.length / 2)];
  const threshold = Math.max(median * 2, median + 8);
  let count = 0, worst = 0, worstR = null;
  for (const r of active.idx) {
    const v = active.ft.series[r];
    if (v > threshold) { count++; if (v > worst) { worst = v; worstR = r; } }
  }
  const worstElapsedMs = worstR != null && file.startTime ? (file.timestamps[worstR].getTime() - file.startTime.getTime()) : null;
  return { count, medianMs: median, thresholdMs: threshold, worstMs: worst, worstElapsedMs, activeCount: active.idx.length };
}

// A large gap between "Presented" and "Displayed" framerate/1%-low means frames the
// game rendered were dropped or repeated before actually reaching the screen.
function framePacingCheck(file) {
  const km = resolveKeyMetrics(file);
  const pAvg = km.fps_avg, dAvg = km.fps_displayed_avg;
  if (!pAvg || !dAvg || pAvg.stats.avg <= 0) return null;
  const gapPct = (pAvg.stats.avg - dAvg.stats.avg) / pAvg.stats.avg;
  return { presentedAvg: pAvg.stats.avg, displayedAvg: dAvg.stats.avg, gapPct };
}

// Best-guess span of "actually playing the game" within a log, as elapsed ms from the
// file's own start — the gap between clicking "Start Logging" and the game actually
// being in the foreground (menus, alt-tabbing, a loading screen) shouldn't count
// against a before/after comparison. Reuses the same active-frame definition as the
// bottleneck/stutter analysis: first to last row where frame rendering looks real.
// Returns null when there isn't enough frame data to say anything (e.g. a non-gaming
// log, or PresentMon wasn't enabled) — Compare Logs falls back to the full log then.
function detectGameplayWindow(file) {
  const active = activeFrameIndices(file);
  if (!active || active.idx.length < 20 || !file.startTime) return null;
  const first = active.idx[0], last = active.idx[active.idx.length - 1];
  const t0 = file.startTime.getTime();
  const startMs = file.timestamps[first].getTime() - t0;
  const endMs = file.timestamps[last].getTime() - t0;
  if (endMs - startMs < 5000) return null; // too narrow to be a meaningful window
  return { startMs, endMs, activeCount: active.idx.length, totalRows: file.nRows };
}

function gamingSummary(file) {
  const proc = getPresentMonProcess(file);
  return {
    process: proc,
    isGame: proc ? !isNonGameProcess(proc) : null,
    bottleneck: computeBottleneck(file),
    stutter: detectStutters(file),
    pacing: framePacingCheck(file),
  };
}


// ===================== MEMORY: EXPO/XMP-vs-JEDEC misconfiguration check =====================
// Common DDR4/DDR5 rated transfer speeds (MT/s) — used to recognize a speed number
// embedded in a module's marketing part number.
const KNOWN_MEM_SPEEDS = [2133, 2400, 2666, 2933, 3000, 3200, 3466, 3600, 3733, 4000, 4266, 4400,
  4800, 5200, 5600, 5800, 6000, 6200, 6400, 6600, 6800, 7000, 7200, 7600, 8000, 8200, 8400, 8800];

// Module part numbers encode rated speed (and often CAS latency) inconsistently across
// vendors, so this is a best-effort read of the label HWiNFO reports, not authoritative
// spec data — always presented as "inferred from the module name" in the UI.
function parseRatedMemoryFromLabel(label) {
  if (!label) return null;
  // Vendor patterns that pair a speed with a CAS code, e.g. "...6000Z30", "...3600C18",
  // "...6400C32", G.Skill-style "...6000J3038..." (first two digits after J/letter = CAS).
  const paired = label.match(/(\d{4,5})[A-Z](\d{2})/);
  let ratedSpeed = null, ratedCAS = null;
  if (paired && KNOWN_MEM_SPEEDS.includes(Number(paired[1]))) {
    ratedSpeed = Number(paired[1]);
    ratedCAS = Number(paired[2]);
  } else {
    // fall back to any 4-digit run matching a known speed bin, ignoring capacity-looking
    // numbers (a "64GB" or "32GB" nearby) by requiring the match not be directly preceded
    // by "GX" capacity/generation markers is impractical in general — just take the first hit.
    const nums = label.match(/\d{4,5}/g) || [];
    for (const n of nums) { if (KNOWN_MEM_SPEEDS.includes(Number(n))) { ratedSpeed = Number(n); break; } }
  }
  if (!ratedSpeed) return null;
  return { ratedSpeed, ratedCAS, sourceLabel: label };
}

function checkMemoryConfig(file) {
  const memClock = file.columns.find(c => /^Memory Clock \[/i.test(c.name) && c.isNumeric && c.stats);
  if (!memClock) return null;
  const tcas = file.columns.find(c => /^Tcas \[/i.test(c.name) && c.isNumeric && c.stats);
  const observedSpeed = Math.round((memClock.stats.max * 2) / 100) * 100; // effective MT/s, rounded to nearest 100
  const observedCAS = tcas ? Math.round(tcas.stats.max) : null;

  const ramLabels = (file.systemInfo && file.systemInfo.ram) || [];
  let rated = null;
  for (const label of ramLabels) { rated = parseRatedMemoryFromLabel(label); if (rated) break; }

  let mismatch = false, gapPct = null;
  if (rated) {
    gapPct = (rated.ratedSpeed - observedSpeed) / rated.ratedSpeed;
    if (gapPct > 0.08) mismatch = true;
  }
  return { observedSpeed, observedCAS, rated, mismatch, gapPct };
}


// ===================== COMPARE: multi-file ordering, deltas, aggregated issues =====================
const METRIC_DIRECTION = {
  cpu_temp: 'lower', vrm_temp: 'lower', gpu_vrm_temp: 'lower', gpu_temp: 'lower', gpu_hotspot: 'lower',
  gpu_mem_temp: 'lower', motherboard_temp: 'lower', ram_load: 'lower', pagefile_use: 'lower',
  cpu_power: 'neutral', gpu_power: 'neutral', vcore: 'neutral',
  cpu_usage: 'neutral', cpu_clock: 'neutral', gpu_util: 'neutral', gpu_clock: 'neutral',
  fps_avg: 'higher', fps_1low: 'higher', dram_read_bw: 'neutral', dram_write_bw: 'neutral',
  fps_displayed_avg: 'higher', fps_displayed_1low: 'higher',
  frame_time_avg: 'lower', gpu_busy: 'lower', gpu_wait: 'lower', cpu_busy: 'lower', cpu_wait: 'lower',
};

// Builds a lightweight view of `file` restricted to an elapsed-time window (ms from the
// file's own start) — used only by Compare Logs' optional "gameplay only" trim, so a
// before/after comparison can skip the setup/menu time around an actual play session.
// Every numeric/boolean column's stats, series, and boolStats are recomputed from just
// the rows inside the window (reusing the exact same computeStats() the initial parse
// uses, so the numbers are on equal footing); everything else — column identity,
// systemInfo, file id/color/label — is carried over unchanged since it doesn't depend
// on time. Downstream code (resolveKeyMetrics, detectIssues, gamingSummary, etc.) reads
// this the same way it reads a normal parsed file and needs no awareness of trimming.
function buildTrimmedFileView(file, startMs, endMs) {
  if (!file.startTime || endMs <= startMs) return file;
  const t0 = file.startTime.getTime();
  const rowIdx = [];
  for (let r = 0; r < file.nRows; r++) {
    const t = file.timestamps[r];
    if (!t) continue;
    const e = t.getTime() - t0;
    if (e >= startMs && e <= endMs) rowIdx.push(r);
  }
  if (rowIdx.length < 2) return file; // window too narrow to be useful — fall back untrimmed

  const timestamps = rowIdx.map(r => file.timestamps[r]);
  const columns = file.columns.map(col => {
    if (col.isNumeric && col.series) {
      const series = rowIdx.map(r => col.series[r]);
      const nums = series.filter(v => v != null);
      return Object.assign({}, col, { series, numData: nums, stats: computeStats(nums) });
    }
    if (col.isBoolean && col.boolSeries) {
      const boolSeries = rowIdx.map(r => col.boolSeries[r]);
      let trueCount = 0, total = 0;
      for (const b of boolSeries) { if (b == null) continue; total++; if (b) trueCount++; }
      return Object.assign({}, col, { boolSeries, boolStats: { trueCount, total, trueFraction: total ? trueCount / total : 0 } });
    }
    return col;
  });

  return Object.assign({}, file, {
    columns, timestamps, nRows: rowIdx.length,
    startTime: timestamps[0], endTime: timestamps[timestamps.length - 1],
    durationMs: timestamps[timestamps.length - 1].getTime() - timestamps[0].getTime(),
    _trimmed: true, _sourceDurationMs: file.durationMs,
  });
}

function orderFilesByPriority(files) {
  return files.slice().sort((a, b) => {
    const at = a.endTime ? a.endTime.getTime() : (a.lastModified || 0);
    const bt = b.endTime ? b.endTime.getTime() : (b.lastModified || 0);
    return bt - at;
  });
}

// Shared delta math: given an "older" and a "newer" per-file stat bundle for one metric,
// returns the raw/percent change and whether that change counts as better/worse/neutral
// for this metric (a metric with no defined direction — e.g. clock speed — is always
// reported as a neutral fact, never colored good/bad).
function computeMetricDelta(olderP, newerP, direction) {
  if (!olderP || !newerP) return null;
  const diff = newerP.avg - olderP.avg;
  const pct = olderP.avg !== 0 ? (diff / Math.abs(olderP.avg)) * 100 : null;
  let verdict = 'neutral';
  if (direction !== 'neutral' && Math.abs(pct || 0) > 2) {
    const improved = direction === 'lower' ? diff < 0 : diff > 0;
    verdict = improved ? 'better' : 'worse';
  }
  return { diff, pct, verdict };
}

function buildComparison(orderedFiles) {
  const rows = [];
  for (const m of KEY_METRICS) {
    const perFile = orderedFiles.map(f => {
      const col = resolveKeyMetrics(f)[m.id];
      return col ? { file: f.fileName, avg: col.stats.avg, max: col.stats.max, min: col.stats.min, last: col.stats.last, col } : null;
    });
    if (perFile.every(p => p === null)) continue;
    const direction = METRIC_DIRECTION[m.id] || 'neutral';

    // One delta per consecutive pair in the order the caller gave us — when that order
    // is chronological (oldest -> newest), this is a left-to-right trend arrow per hop.
    const deltas = [];
    for (let i = 1; i < perFile.length; i++) deltas.push(computeMetricDelta(perFile[i - 1], perFile[i], direction));

    // Backward-compatible single "headline" delta. Callers that only want a two-file
    // newest-vs-previous summary (e.g. the plain-text report) pass files newest-first,
    // so index 0 is newer than index 1 here regardless of what order the Compare view uses.
    const delta = orderedFiles.length >= 2 ? computeMetricDelta(perFile[1], perFile[0], direction) : null;

    rows.push({ id: m.id, label: m.label, unit: m.unit, group: m.group, direction, perFile, delta, deltas });
  }
  return rows;
}

// "Best overall run" — a composite score across three competing goals (thermals,
// power, performance), used to put a star on whichever loaded log came out on top,
// and to show a breakdown of *why* so a tradeoff (e.g. "a lot more FPS for a little
// more heat") reads as the net win it actually was.
//
// Each named profile is just a different weighting between the three categories —
// none is "correct", they're starting points for what the person is optimizing for
// (a quiet/cool build vs. chasing frames). The person can switch profiles live in
// the Compare Logs view; STATE.scoreProfile tracks the current choice.
const SCORING_PROFILES = {
  balanced: { label: 'Balanced', thermals: 0.35, power: 0.25, performance: 0.40 },
  cooler: { label: 'Cooler & quieter', thermals: 0.40, power: 0.30, performance: 0.30 },
  performance: { label: 'Performance', thermals: 0.20, power: 0.20, performance: 0.60 },
};

const SCORE_CATEGORIES = {
  thermals: [
    { id: 'cpu_temp', field: 'max', direction: 'lower' },
    { id: 'gpu_temp', field: 'max', direction: 'lower' },
    { id: 'gpu_hotspot', field: 'max', direction: 'lower' },
  ],
  power: [
    { id: 'cpu_power', field: 'avg', direction: 'lower' },
    { id: 'gpu_power', field: 'avg', direction: 'lower' },
  ],
  performance: [
    { id: 'fps_avg', field: 'avg', direction: 'higher' },
    { id: 'fps_1low', field: 'avg', direction: 'higher' },
  ],
};

// The categories deliberately don't all score off the same statistic: Thermals uses
// each run's session PEAK (max) temperature, because what actually risks throttling
// or an emergency shutdown is the worst moment, not the average — a run that spent
// most of its time cool but spiked once is still a run that spiked. Power and
// Performance score off session AVERAGES instead. This is a reasonable design choice,
// but it means the Run Verdict's Thermals score can disagree with the (always-average)
// numbers in the Metric deltas table — a run with a lower average temp can still lose
// on Thermals if it had a higher peak somewhere. These two helpers make that basis
// visible in the UI instead of leaving people to reverse-engineer it, and a longer run
// has strictly more opportunity to contain a brief spike than a shorter one, which is
// exactly the kind of run-length mismatch the "tips" panel warns about.
function categoryScoreBasis(cat) {
  const metrics = SCORE_CATEGORIES[cat] || [];
  const fields = new Set(metrics.map(m => m.field));
  if (fields.size !== 1) return 'mixed';
  const f = [...fields][0];
  return f === 'max' ? 'peak' : f === 'min' ? 'best-case' : 'avg';
}
function categoryScoreTooltip(cat) {
  const metrics = SCORE_CATEGORIES[cat] || [];
  const basis = categoryScoreBasis(cat);
  const basisPhrase = basis === 'peak' ? "each run's peak (max)" : basis === 'best-case' ? "each run's best-case (min)" : "each run's session average";
  const names = metrics.map(m => {
    const km = (typeof KEY_METRICS !== 'undefined') ? KEY_METRICS.find(k => k.id === m.id) : null;
    return km ? km.label : m.id;
  });
  if (cat === 'performance') names.push('frame-pacing / stutter rate');
  return `Based on ${basisPhrase} of: ${names.join(', ')}.`;
}

// Min-max normalizes one metric's values across the loaded runs to 0 (best of the
// set) .. 1 (worst of the set). Unlike a plain rank, this preserves how big the gaps
// actually were: a metric that barely moves across runs ends up with everyone
// clustered near the same normalized value and barely swings the score, while a
// metric with a wide spread swings it a lot — which is exactly what "a lot more FPS
// for a little more heat" needs in order to net out as a clear win.
//
// With 3+ runs this falls out naturally: min-max is a rank-preserving stretch across
// the whole set, so a tightly clustered metric already normalizes to values that stay
// near each other. But with exactly 2 runs, min-max degenerates — whichever value is
// smaller IS the minimum and whichever is larger IS the maximum, by definition, no
// matter how close together they actually are. A 152.0-vs-152.1 FPS "tie" and a
// 100-vs-152 FPS blowout would both collapse to the same hard 0/1 split, which is
// exactly backwards. So for the 2-run case, score off the actual relative % difference
// between the two values instead: a near-tie lands near 0.5/0.5, and the split only
// approaches the full 0/1 once the gap is big enough to call decisive.
const TWO_RUN_DECISIVE_PCT = 0.05; // relative % difference at/above which a 2-run comparison scores as a full 0/1 split
function twoRunNormalize(present, direction) {
  const out = new Map();
  const [a, b] = present;
  if (a.value === b.value) { out.set(a.id, 0.5); out.set(b.id, 0.5); return out; }
  const aIsBetter = direction === 'lower' ? a.value < b.value : a.value > b.value;
  const winner = aIsBetter ? a : b;
  const loser = aIsBetter ? b : a;
  const avgMag = Math.abs(a.value + b.value) / 2 || 1;
  const relDiff = Math.abs(a.value - b.value) / avgMag;
  const t = Math.min(1, relDiff / TWO_RUN_DECISIVE_PCT); // 0 = indistinguishable, 1 = fully decisive
  out.set(winner.id, 0.5 - 0.5 * t);
  out.set(loser.id, 0.5 + 0.5 * t);
  return out;
}
function minMaxNormalize(entries, direction) {
  const present = entries.filter(e => e.value != null && !Number.isNaN(e.value));
  const out = new Map();
  if (present.length < 2) return out;
  if (present.length === 2) return twoRunNormalize(present, direction);
  const values = present.map(e => e.value);
  const lo = Math.min(...values), hi = Math.max(...values);
  const span = hi - lo;
  for (const e of present) {
    if (span === 0) { out.set(e.id, 0); continue; }
    const frac = (e.value - lo) / span;
    out.set(e.id, direction === 'lower' ? frac : 1 - frac);
  }
  return out;
}

// Computes a 0-100 composite score per file (100 = best of the loaded runs), plus a
// per-category (thermals/power/performance) breakdown, using the given scoring
// profile. Categories with no usable sensor data across the loaded logs are dropped
// and the remaining weights renormalized, so e.g. a log with no power sensors doesn't
// get skewed by a missing category.
function computeCompositeScores(files, profileKey) {
  if (!files || files.length < 2) return null;
  const profile = SCORING_PROFILES[profileKey] || SCORING_PROFILES.balanced;
  const categoryScores = {};
  const categoryHasData = {};

  for (const [cat, metrics] of Object.entries(SCORE_CATEGORIES)) {
    const totals = new Map(files.map(f => [f.id, { sum: 0, count: 0 }]));
    for (const def of metrics) {
      const entries = files.map(f => {
        const col = resolveKeyMetrics(f)[def.id];
        return { id: f.id, value: col && col.stats ? col.stats[def.field] : null };
      });
      for (const [id, val] of minMaxNormalize(entries, def.direction).entries()) {
        const t = totals.get(id); t.sum += val; t.count++;
      }
    }
    // Frame-pacing smoothness (stutter rate) folds into "performance" alongside FPS,
    // sourced from the same gaming analysis shown on the Gaming tab.
    if (cat === 'performance' && typeof gamingSummary === 'function') {
      const entries = files.map(f => {
        const gs = gamingSummary(f);
        const rate = gs && gs.stutter && gs.stutter.activeCount >= 20 ? gs.stutter.count / gs.stutter.activeCount : null;
        return { id: f.id, value: rate };
      });
      for (const [id, val] of minMaxNormalize(entries, 'lower').entries()) {
        const t = totals.get(id); t.sum += val; t.count++;
      }
    }
    const scores = new Map();
    let any = false;
    for (const f of files) {
      const t = totals.get(f.id);
      if (t.count > 0) { scores.set(f.id, t.sum / t.count); any = true; }
    }
    categoryScores[cat] = scores;
    categoryHasData[cat] = any;
  }

  const activeCats = Object.keys(SCORE_CATEGORIES).filter(c => categoryHasData[c]);
  if (!activeCats.length) return null;
  const weightSum = activeCats.reduce((s, c) => s + profile[c], 0) || 1;

  const perFile = files.map(f => {
    const breakdown = {};
    let composite = 0;
    for (const c of activeCats) {
      const raw = categoryScores[c].has(f.id) ? categoryScores[c].get(f.id) : null; // 0 = best, 1 = worst
      breakdown[c] = raw == null ? null : Math.round((1 - raw) * 100);
      if (raw != null) composite += (profile[c] / weightSum) * raw;
    }
    return { id: f.id, fileName: f.fileName, composite: Math.round((1 - composite) * 100), breakdown };
  });
  perFile.sort((a, b) => b.composite - a.composite);
  return { profile: profileKey, categories: activeCats, perFile, bestId: perFile[0] ? perFile[0].id : null };
}

// Backward-compatible wrapper for the older single-"best file" call sites (topbar
// chip, Summary table) — same composite scoring underneath, just the winner's id.
function computeHolisticRanking(files, profileKey) {
  const result = computeCompositeScores(files, profileKey);
  return result && result.bestId ? { id: result.bestId } : null;
}

function topIssuesAcrossFiles(orderedFiles) {
  const perFileIssues = orderedFiles.map(f => ({ file: f, issues: detectIssues(f) }));
  const byKey = new Map();
  orderedFiles.forEach((f, fileIdx) => {
    for (const issue of perFileIssues[fileIdx].issues) {
      const key = issue.id.replace(/_\d+$/, '');
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push(Object.assign({}, issue, { fileIdx, fileName: f.fileName }));
    }
  });
  const merged = [];
  for (const [key, occurrences] of byKey.entries()) {
    occurrences.sort((a, b) => SEVERITY_RANK[b.severity] - SEVERITY_RANK[a.severity] || a.fileIdx - b.fileIdx);
    const worst = occurrences[0];
    const fileCount = new Set(occurrences.map(o => o.fileIdx)).size;
    const inNewest = occurrences.some(o => o.fileIdx === 0);
    const score = SEVERITY_RANK[worst.severity] * 1000 + fileCount * 50 + (inNewest ? 25 : 0);
    merged.push({ key, severity: worst.severity, title: worst.title, detail: worst.detail, suggestion: worst.suggestion, category: worst.category, occurrences, fileCount, totalFiles: orderedFiles.length, inNewest, score });
  }
  merged.sort((a, b) => b.score - a.score);
  return { top: merged.slice(0, 5), all: merged, perFileIssues };
}


// ===================== CHARTS: decimation + inline SVG line charts + sparklines =====================
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// Elapsed-time points (ms since the file's own start) — lets sessions of different
// wall-clock dates overlay meaningfully by "minutes into the run".
function elapsedPoints(file, col) {
  if (!col || !col.series || !file.startTime) return [];
  const t0 = file.startTime.getTime();
  const pts = [];
  for (let r = 0; r < file.nRows; r++) {
    const t = file.timestamps[r], v = col.series[r];
    if (t != null && v != null) pts.push({ t: t.getTime() - t0, v });
  }
  return pts;
}

// Min/max-preserving decimation: keeps visual spikes even when reducing point count.
function decimate(points, maxPoints) {
  if (points.length <= maxPoints) return points;
  const bucketSize = points.length / (maxPoints / 2);
  const out = [];
  for (let i = 0; i < points.length; i += bucketSize) {
    const end = Math.min(points.length, Math.floor(i + bucketSize));
    let lo = points[Math.floor(i)], hi = points[Math.floor(i)];
    for (let j = Math.floor(i); j < end; j++) { if (points[j].v < lo.v) lo = points[j]; if (points[j].v > hi.v) hi = points[j]; }
    if (lo.t <= hi.t) { out.push(lo, hi); } else { out.push(hi, lo); }
  }
  return out;
}

function fmtElapsed(ms) {
  const s = Math.round(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), rs = s % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
  if (m > 0) return `${m}m ${String(rs).padStart(2, '0')}s`;
  return `${rs}s`;
}
function fmtValue(v, unit) {
  if (v == null) return '—';
  const abs = Math.abs(v);
  const s = abs >= 100 ? v.toFixed(0) : abs >= 10 ? v.toFixed(1) : v.toFixed(2);
  return unit ? `${s} ${unit}` : s;
}

// series: [{label, color, points:[{t,v}]}]  (t = ms elapsed, v = value)
function buildLineChart(series, opts) {
  opts = opts || {};
  const W = opts.width || 600, H = opts.height || 190;
  const padL = 40, padR = 12, padT = 12, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const unit = opts.unit || '';

  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';

  const allPts = series.flatMap(s => s.points);
  if (!allPts.length) {
    wrap.innerHTML = '<div class="footnote" style="padding:24px 0;text-align:center;">No data for this metric.</div>';
    return wrap;
  }
  let minV = Math.min(...allPts.map(p => p.v)), trueMaxV = Math.max(...allPts.map(p => p.v));
  let maxV = trueMaxV;
  let clipped = false;
  // A handful of extreme outliers (a single huge stutter spike, say) can flatten
  // the rest of an otherwise-readable chart. When asked, cap the visible axis at a
  // percentile and let outlier points draw pinned to the top edge instead.
  if (opts.clipPercentile && allPts.length > 20) {
    const sorted = allPts.map(p => p.v).sort((a, b) => a - b);
    const capV = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * opts.clipPercentile))];
    if (capV > 0 && capV < trueMaxV * 0.6) { maxV = capV; clipped = true; }
  }
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const pad = (maxV - minV) * 0.08;
  minV -= pad; maxV += pad * (clipped ? 2.2 : 1);
  if (opts.zeroFloor && minV < 0 && Math.min(...allPts.map(p => p.v)) >= 0) minV = 0;
  const maxT = Math.max(...allPts.map(p => p.t));
  const minT = 0;

  const x = t => padL + (maxT === minT ? 0 : ((t - minT) / (maxT - minT)) * plotW);
  const yRaw = v => padT + plotH - ((v - minV) / (maxV - minV)) * plotH;
  const y = v => clipped ? Math.max(padT + 1.5, yRaw(v)) : yRaw(v);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, preserveAspectRatio: 'none' });
  svg.style.display = 'block';
  svg.style.overflow = clipped ? 'hidden' : 'visible';

  // gridlines (3 horizontal bands)
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#e1e0d9';
  const mutedColor = getComputedStyle(document.documentElement).getPropertyValue('--ink-muted').trim() || '#898781';
  const nGrid = 3;
  for (let i = 0; i <= nGrid; i++) {
    const v = minV + ((maxV - minV) * i) / nGrid;
    const yy = y(v);
    svg.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, stroke: gridColor, 'stroke-width': 1 }));
    const label = svgEl('text', { x: padL - 6, y: yy + 3, 'text-anchor': 'end', 'font-size': 9.5, fill: mutedColor, 'font-family': 'IBM Plex Mono, monospace' });
    label.textContent = fmtValue(v, '');
    svg.appendChild(label);
  }
  // x-axis labels (start / mid / end elapsed time)
  for (const frac of [0, 0.5, 1]) {
    const t = minT + (maxT - minT) * frac;
    const xx = x(t);
    const anchor = frac === 0 ? 'start' : frac === 1 ? 'end' : 'middle';
    const label = svgEl('text', { x: xx, y: H - 6, 'text-anchor': anchor, 'font-size': 9.5, fill: mutedColor, 'font-family': 'IBM Plex Mono, monospace' });
    label.textContent = fmtElapsed(t);
    svg.appendChild(label);
  }

  const seriesRendered = series.filter(s => s.points.length);
  for (const s of seriesRendered) {
    const dec = decimate(s.points, 700);
    if (opts.area && seriesRendered.length === 1) {
      const areaPts = [`${x(dec[0].t)},${y(minV)}`, ...dec.map(p => `${x(p.t)},${y(p.v)}`), `${x(dec[dec.length - 1].t)},${y(minV)}`].join(' ');
      svg.appendChild(svgEl('polygon', { points: areaPts, fill: s.color, opacity: 0.12, stroke: 'none' }));
    }
    const d = dec.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    svg.appendChild(svgEl('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 1.75, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    // emphasize endpoint
    const last = dec[dec.length - 1];
    svg.appendChild(svgEl('circle', { cx: x(last.t), cy: y(last.v), r: 2.6, fill: s.color }));
  }

  // hover layer
  const hoverLine = svgEl('line', { x1: 0, x2: 0, y1: padT, y2: padT + plotH, stroke: mutedColor, 'stroke-width': 1, opacity: 0 });
  svg.appendChild(hoverLine);
  const hoverDots = seriesRendered.map(s => { const c = svgEl('circle', { r: 3.4, fill: s.color, stroke: 'var(--surface)', 'stroke-width': 1.5, opacity: 0 }); svg.appendChild(c); return c; });
  const hitRect = svgEl('rect', { x: padL, y: padT, width: plotW, height: plotH, fill: 'transparent' });
  svg.appendChild(hitRect);

  const tooltip = document.createElement('div');
  tooltip.className = 'chart-tooltip';
  wrap.appendChild(svg);
  wrap.appendChild(tooltip);
  if (clipped) {
    const note = document.createElement('div');
    note.className = 'footnote';
    note.style.marginTop = '2px';
    note.textContent = `Y-axis capped near the typical range so occasional spikes (up to ${fmtValue(trueMaxV, unit)}) don't flatten the rest of the chart — hover to see exact values.`;
    wrap.appendChild(note);
  }

  function nearestIndex(points, t) {
    let lo = 0, hi = points.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (points[mid].t < t) lo = mid + 1; else hi = mid; }
    return lo;
  }

  hitRect.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const frac = Math.min(1, Math.max(0, (px - (padL * rect.width / W)) / ((plotW) * rect.width / W)));
    const t = minT + frac * (maxT - minT);
    let html = `<div class="tt-time">${fmtElapsed(t)} elapsed</div>`;
    let anyX = null, anyY = null;
    seriesRendered.forEach((s, i) => {
      const idx = nearestIndex(s.points, t);
      const p = s.points[Math.max(0, Math.min(s.points.length - 1, idx))];
      if (!p) { hoverDots[i].setAttribute('opacity', 0); return; }
      hoverDots[i].setAttribute('cx', x(p.t)); hoverDots[i].setAttribute('cy', y(p.v)); hoverDots[i].setAttribute('opacity', 1);
      if (anyX == null) { anyX = x(p.t); anyY = y(p.v); }
      html += `<div class="tt-row"><span class="sw" style="background:${s.color}"></span>${seriesRendered.length > 1 ? s.label + ': ' : ''}<b>${fmtValue(p.v, unit)}</b></div>`;
    });
    hoverLine.setAttribute('x1', anyX); hoverLine.setAttribute('x2', anyX); hoverLine.setAttribute('opacity', 1);
    tooltip.innerHTML = html;
    tooltip.style.opacity = 1;
    const leftPct = (anyX / W) * 100;
    tooltip.style.left = `${leftPct}%`;
    tooltip.style.top = `${(anyY / H) * 100}%`;
  });
  hitRect.addEventListener('mouseleave', () => {
    hoverLine.setAttribute('opacity', 0);
    hoverDots.forEach(d => d.setAttribute('opacity', 0));
    tooltip.style.opacity = 0;
  });

  return wrap;
}

// Compact sparkline for stat tiles — single series, no axes.
function buildSparkline(points, color) {
  const W = 200, H = 32;
  if (!points.length) return svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'spark' });
  const dec = decimate(points, 80);
  const vs = dec.map(p => p.v);
  let minV = Math.min(...vs), maxV = Math.max(...vs);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const x = i => (i / (dec.length - 1 || 1)) * W;
  const y = v => H - 3 - ((v - minV) / (maxV - minV)) * (H - 6);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'spark', preserveAspectRatio: 'none' });
  const linePts = dec.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const areaPts = `0,${H} ${linePts} ${W},${H}`;
  svg.appendChild(svgEl('polygon', { points: areaPts, fill: color, opacity: 0.14, stroke: 'none' }));
  svg.appendChild(svgEl('polyline', { points: linePts, fill: 'none', stroke: color, 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  const lastI = dec.length - 1;
  svg.appendChild(svgEl('circle', { cx: x(lastI), cy: y(dec[lastI].v), r: 2.2, fill: color }));
  return svg;
}

// Testing methodology tips — not derived from a log, just hard-won advice for getting
// a comparison you can actually trust. Shared between the Settings page (full list) and
// a compact panel on Compare Logs, so the two never drift out of sync.
const TESTING_TIPS = [
  { title: 'Match your environment', detail: 'Test at a similar time of day and room temperature, and note things like AC, open windows, or the season. Ambient swings alone can shift CPU/GPU temps by several degrees between two otherwise "identical" runs.' },
  { title: 'Change one thing at a time', detail: "If you're testing a new fan curve, don't also update GPU drivers or tweak BIOS settings in the same pass — otherwise you won't know which change actually caused the difference you see." },
  { title: 'Same workload, same length', detail: 'Use the same benchmark, save file, or game section each time, for a similar duration. A different map, area, or run length changes the numbers on its own, independent of any hardware or setting change.' },
  { title: 'Let it warm up first', detail: "Start logging a couple of minutes into the load, not from a cold boot. Comparing a cold run to a warmed-up run makes a real change look bigger (or smaller) than it actually is." },
  { title: 'Games are especially noisy', detail: "Procedurally generated or multiplayer maps, bots vs. real players, and per-match AI/physics load all vary run to run, even in \"the same\" game. Prefer a fixed benchmark mode or a scripted offline route when one exists, and treat FPS deltas from live multiplayer matches as a rough signal, not a precise measurement." },
  { title: 'Keep software state consistent', detail: 'Same Windows power plan, same GPU driver version, and the same background apps (Discord, browser tabs, overlays, Windows Update) running — or closed — the same way across every run you compare.' },
  { title: 'Label your logs', detail: 'Use the filename or the in-app label (e.g. "before-fan-curve", "after-fan-curve") to note what changed, so it is still obvious which log is which when you come back to compare weeks later.' },
  { title: 'Trim out the setup time', detail: 'Starting the logger, switching screens, and launching the game all add a few minutes of non-representative time to the start (and often the end) of a log. If you’re specifically testing a game’s performance, use the "Gameplay window" panel on the Compare Logs page to trim each log to when frames were actually being rendered, instead of comparing the full recorded session.' },
];
function tipListHtml(tips) {
  return `<div class="tip-list">${tips.map(t => `<div class="tip-item">${icon('lightbulb')}<div><b>${escapeHtml(t.title)}</b><p>${escapeHtml(t.detail)}</p></div></div>`).join('')}</div>`;
}

  activeView: 'summary',

  scoreProfile: 'balanced', // which weighting "best overall run" uses — switchable in Compare Logs
